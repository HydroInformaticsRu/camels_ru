[tool.ruff]
# Honor classic PEP 8 width for code (105) and keep notebooks in scope.
line-length = 105
target-version = "py312"
extend-include = ["*.ipynb"]
exclude = [
  ".git",
  ".venv",
  "build",
  "dist",
  "__pypackages__",
  "**/__pycache__/**",
  "**/data/**",
  "docs/_build",
]

[tool.ruff.lint]
# Core PEP 8/pycodestyle + pragmatic extras.
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # Pyflakes
  "I",    # isort (import sorting)
  "N",    # pep8-naming
  "D",    # pydocstyle (docstrings)
  "UP",   # pyupgrade
  "B",    # flake8-bugbear
  "S",    # flake8-bandit (security)
  "C4",   # flake8-comprehensions
  "Q",    # flake8-quotes
  "T20",  # flake8-print
  "A",    # flake8-builtins (shadowing builtins)
  "C90",  # mccabe (cyclomatic complexity)
  "PIE",  # flake8-pie (small correctness wins)
]
# Keep Black-style whitespace compatibility and avoid noisy docstring pedantry.
ignore = [
  "E203",  # whitespace before ':' — Black/Ruff-formatter compatible
  "D100",  # missing docstring in public module
  "D104",  # missing docstring in public package
  "S101",  # use of assert (we allow in tests; see per-file too)
]

[tool.ruff.lint.per-file-ignores]
# Tests: allow asserts and relax strict docstrings / prints.
"tests/**/*" = ["S101", "D100", "D101", "D102", "D103", "T20"]
# Scripts/CLI/notebooks: allow prints and skip docstring requirements for notebooks.
"scripts/**/*" = ["T20"]
"notebooks/**/*.py" = ["D", "T20", "S112"]
"**/*.ipynb" = ["D", "T20"]

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"
inline-quotes = "double"

[tool.ruff.lint.isort]
known-first-party = ["hydro", "meteo", "quality", "data_processing", "plots", "static", "timeseries_stats", "utils"]
split-on-trailing-comma = true
combine-as-imports = true
force-sort-within-sections = true

[tool.ruff.lint.pydocstyle]
# Google style docstrings; keep concise one-line summaries.
convention = "google"

[tool.ruff.lint.mccabe]
# PEP 8 nudges toward simplicity; cap complexity.
max-complexity = 10

[tool.ruff.format]
# Match quote policy with lint rules and keep docstring code tidy.
quote-style = "double"
docstring-code-format = true
# PEP 8 suggests ~72 columns for comments/docstrings; apply to fenced code in docstrings.
docstring-code-line-length = 72

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
exclude = [
  "**/data",
  "/data",
  "**/__pycache__",
  ".venv",
  "build",
  "dist",
]
reportMissingImports = true
reportMissingTypeStubs = false

[project]
name = "camels-ru"
version = "0.1.0"
description = "CAMELS-RU. Hydroclimatic dataset for Russia."
authors = [{ name = "Dmitrii Abramov", email = "dmbrmv96@gmail.com" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = ["transliterate>=1.10.2,<2"]
[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
camels-ru = { path = ".", editable = true }

[tool.pixi.tasks]
lint = "ruff check src/"
format = "ruff format src/"
typecheck = "pyright src/"

[tool.pixi.dependencies]
pysheds = ">=0.5,<0.6"
numpy = "1.26.4.*"
numba = "0.59.1.*"
gdal = ">=3.12.2,<4"
geopandas = ">=1.1.2,<2"
ipykernel = ">=7.2.0,<8"
jupyter = ">=1.1.1,<2"
ipywidgets = ">=8.1.8,<9"
tqdm = ">=4.67.3,<5"
rioxarray = ">=0.20.0,<0.21"
netcdf4 = ">=1.7.4,<2"
cfgrib = ">=0.9.15.1,<0.10"
bottleneck = ">=1.6.0,<2"
dask = ">=2026.1.2,<2027"
h5netcdf = ">=1.8.1,<2"
fiona = ">=1.10.1,<2"
shapely = ">=2.1.2,<3"
ruff = ">=0.9.0"
pyright = ">=1.1.0"
lxml = ">=6.0.2,<7"
paramiko = ">=4.0.0,<5"
html5lib = ">=1.1,<2"
xlrd = ">=2.0.2,<3"
