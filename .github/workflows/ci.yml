name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          cache: true

      - name: Lint with ruff
        run: pixi run lint

      - name: Run tests
        # The tests are self-checking scripts (each has a __main__ block); pytest is
        # deliberately not a dependency.
        run: |
          for t in tests/test_*.py; do
            echo "== $t"
            pixi run python "$t" || exit 1
          done
