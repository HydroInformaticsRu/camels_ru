name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          cache: true

      - name: Lint with ruff
        run: pixi run ruff check src/

      - name: Run tests
        run: |
          if [ -d tests ]; then
            pixi run pytest tests/
          else
            echo "No tests/ directory found — skipping pytest"
          fi
